# Publishes a preview of the installed exhibit, built for the public target.
#
# Pages is a testing ground, not a product surface: somewhere to open the
# exhibit in a browser and look at it. Nothing here is an address to give a
# visitor, which is why CIHOF_SITE_URL is deliberately not set — the share
# panel should report that this build has no public site to link to, because it
# has not got one.
#
# The public target carries no films. That is the point of publishing it rather
# than the kiosk build, and the "Artifact is cleared" step below refuses to
# deploy anything that turns out otherwise.
name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  # Pull requests run the tests without building or deploying, so a change is
  # checked before it reaches the branch that publishes.
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Deploys to main serialise and are never cancelled. Pull requests get their
  # own group so a test run cannot delay a deploy, and a superseded push to a
  # pull request cancels its predecessor rather than queueing behind it.
  group: pages-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Setup Node
        uses: actions/setup-node@v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Only Chromium. The suites drive one browser, and installing three would
      # add minutes to every deploy for coverage nothing asserts.
      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Typecheck
        run: npm run typecheck

      # Cheapest and most valuable check here. A suite that collects nothing
      # exits the same way as a suite with nothing to say, which is how two
      # live regressions once hid behind a green-looking failure.
      - name: Suite integrity
        run: |
          npm run test:count
          npm run test:count:staff
          npm run test:count:portal

      - name: Shared packages
        run: |
          npm test --workspace @cihof/content
          npm test --workspace @cihof/pipeline

      # Both curator sheets: who each recorded inducter name is, and what each
      # person changed. A sheet that has drifted from the roster silently loses
      # rows, and the rows are somebody's review work.
      - name: Curator sheets are current
        run: npm run crosswalk:check

      # Catches the silent failure: a film's captions left untracked inside the
      # ignored video folder, so the wall builds without them and says nothing.
      - name: Film assets are in the repository
        run: npm run media:assert

      - name: Exhibit state and selectors
        run: npm test --workspace @cihof/exhibit

      - name: Visitor suite
        run: npx playwright test

      - name: Staff suite
        run: npx playwright test -c playwright.staff.config.ts

      - name: Portal suite
        run: npx playwright test -c playwright.portal.config.ts

      - name: Rebuilt exhibit, in a browser
        run: npx playwright test -c apps/exhibit/playwright.config.ts

      - name: Companion site, in a browser
        run: npx playwright test
        working-directory: apps/web

      # Only on failure, and only the traces — a passing run should not spend
      # time or storage on artefacts nobody will open.
      - name: Upload failure traces
        if: failure()
        uses: actions/upload-artifact@v5.0.0
        with:
          name: playwright-traces
          path: |
            test-results/
            apps/exhibit/test-results/
            apps/web/test-results/
          retention-days: 7
          if-no-files-found: ignore

  build:
    name: Build exhibit preview
    needs: test
    # A pull request is checked, not published.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Setup Node
        uses: actions/setup-node@v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      # CIHOF_TARGET is passed explicitly and the build refuses to run without
      # it under CI. It used to fall through to the kiosk target, which is the
      # one artifact that must never be published.
      #
      # CIHOF_SITE_URL is unset on purpose: a preview is a moving address, and
      # a QR code printed into a stranger's browser history cannot be corrected
      # afterwards. With no site configured the share panel says so.
      - name: Build exhibit for the public target
        run: npm run build --workspace @cihof/exhibit
        env:
          CIHOF_TARGET: public
          CIHOF_BASE_PATH: /cihof/

      # The only check in this repository that looks at the bytes being
      # uploaded rather than the sources they came from. Everything else
      # validates inputs; a misconfigured build passes all of those.
      - name: Artifact is cleared for publication
        run: npm run assert:public --workspace @cihof/exhibit

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: apps/exhibit/dist

  deploy:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5.0.0
